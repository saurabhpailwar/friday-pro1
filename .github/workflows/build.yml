name: FRIDAY PRO - FINAL FIX
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Deps + Java 17 Fix
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip git python3-pip autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev libtinfo6 libncurses-dev
          sudo update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java || true
          sudo update-alternatives --set javac /usr/lib/jvm/java-17-openjdk-amd64/bin/javac || true
          java -version
          pip install buildozer cython==0.29.36

      - name: Install Android SDK MANUALLY
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
          unzip -q commandlinetools-linux-10406996_latest.zip
          mv cmdline-tools latest
          mkdir -p $HOME/.buildozer/android/platform/
          rm -rf $HOME/.buildozer/android/platform/android-sdk
          ln -sf $HOME/android-sdk $HOME/.buildozer/android/platform/android-sdk
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          mkdir -p $ANDROID_HOME/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > $ANDROID_HOME/licenses/android-sdk-preview-license
          yes | sdkmanager --licenses
          sdkmanager "build-tools;33.0.2" "platforms;android-33" "platform-tools"
          ls $ANDROID_HOME/build-tools/33.0.2/aidl && echo "AIDL FIXED"

      - name: Build APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          if [ -f "friday-pro1/buildozer.spec" ]; then cd friday-pro1; fi
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-PRO-APK
          path: "**/bin/*.apk"
