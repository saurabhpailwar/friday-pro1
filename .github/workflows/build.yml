name: FRIDAY PRO - FINAL FIX
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip git python3-pip autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev libtinfo6
          sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5 || true
          pip install buildozer cython==0.29.36

      - name: Fix SDK Manager Path
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          # SDK download
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
          unzip -q commandlinetools-linux-10406996_latest.zip
          mv cmdline-tools latest
          # --- YAHI TERA ERROR FIX HAI ---
          # Purana wala path banao jahan buildozer dhoondh raha hai
          mkdir -p $HOME/android-sdk/tools/bin
          cp $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager $HOME/android-sdk/tools/bin/
          cp -r $HOME/android-sdk/cmdline-tools/latest/lib $HOME/android-sdk/tools/ || true
          cp -r $HOME/android-sdk/cmdline-tools/latest/lib $HOME/android-sdk/cmdline-tools/latest/bin/ || true
          # buildozer ke liye link
          mkdir -p $HOME/.buildozer/android/platform/
          rm -rf $HOME/.buildozer/android/platform/android-sdk
          ln -sf $HOME/android-sdk $HOME/.buildozer/android/platform/android-sdk
          # licenses
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin
          mkdir -p $ANDROID_HOME/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;33.0.2" "platforms;android-33" "platform-tools"
          sdkmanager "ndk;28c"
          ls $ANDROID_HOME/build-tools/33.0.2/aidl

      - name: Build APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools
          if [ -f "friday-pro1/buildozer.spec" ]; then cd friday-pro1; fi
          # NDK 28c use kar - p4a ka recommended hai
          sed -i 's/android.ndk = 25b/android.ndk = 28c/' buildozer.spec || true
          cat buildozer.spec
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-PRO-APK
          path: "**/bin/*.apk"
