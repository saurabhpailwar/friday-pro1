name: FRIDAY PRO - FINAL ONE SHOT
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip git python3-pip autoconf libtool pkg-config libffi-dev libssl-dev
          pip install buildozer cython==0.29.36
      - name: Build APK
        run: |
          cd friday-pro1
          buildozer android debug || true
          SDKMANAGER=$(find ~/.buildozer -name sdkmanager | head -n 1)
          yes | $SDKMANAGER --licenses || true
          yes | $SDKMANAGER "build-tools;33.0.2" "platforms;android-33" || true
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-PRO-APK
          path: friday-pro1/bin/*.apk
