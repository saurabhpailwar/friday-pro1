name: Build FRIDAY PRO APK - Aidl Fixed Final

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies - All Past Fixes Included
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev automake

      - name: Install Buildozer - Cython Fixed
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer

      - name: Fix All Licenses - Aidl Error Permanent Fix
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          mkdir -p $ANDROID_HOME/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea686b4" > $ANDROID_HOME/licenses/android-sdk-preview-license
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          # Force install build-tools jisse Aidl milega
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;37.0.0" "build-tools;34.0.0" "platform-tools" || true

      - name: Build APK - With Retry
        run: |
          # Buildozer ke apne SDK ke liye bhi license bana do
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          cp $ANDROID_HOME/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ || true
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-PRO-APK
          path: bin/*.apk
