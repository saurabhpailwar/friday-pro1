name: FRIDAY PRO - FINAL ONE SHOT
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies - libtinfo5 fix
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip git python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev libffi-dev libssl-dev libtinfo6
          # libtinfo5 -> libtinfo6 ka jugaad - ubuntu 22.04 pe 5 milta hi nahi
          sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5 || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Clean Old Cache
        run: rm -rf ~/.buildozer.buildozer friday-pro1/.buildozer friday-pro1/friday-pro1/.buildozer

      - name: Build APK
        run: |
          echo "=== KAHAN HAI SPEC ==="
          ls -la
          ls -la friday-pro1 || true
          # Smart cd - triple folder wala error fix
          if [ -f "friday-pro1/friday-pro1/buildozer.spec" ]; then
            cd friday-pro1/friday-pro1
          elif [ -f "friday-pro1/buildozer.spec" ]; then
            cd friday-pro1
          fi
          pwd
          cat buildozer.spec

          # Pehla run - SDK download karne ke liye
          buildozer android debug || true

          # sdkmanager ka naya path dhoondo
          SDKMANAGER=$(find ~/.buildozer -path "*cmdline-tools/latest/bin/sdkmanager" | head -n 1)
          echo "SDKMANAGER NEW: $SDKMANAGER"

          # Purana wala path jo buildozer dhoondhta hai - wahan copy kar do - YEHI TERA 9 no. error fix hai
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          cp $SDKMANAGER ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager || true
          chmod +x ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager || true
          chmod +x $SDKMANAGER || true

          # License force se banao - Aidl wala error isi se fix hoga
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          echo "24333f8a63b6825ea9c5514f83c1051866b9ae7b" > ~/.buildozer/android/platform/android-sdk/licenses/android-googletv-license

          yes | $SDKMANAGER --licenses || true
          yes | $SDKMANAGER "build-tools;33.0.2" "platforms;android-33" "platform-tools" || true

          # Aidl hai ya nahi check
          ls ~/.buildozer/android/platform/android-sdk/build-tools/ || true
          ls ~/.buildozer/android/platform/android-sdk/build-tools/33.0.2/ | grep aidl || true

          # Final Build
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-PRO-APK
          path: |
            **/bin/*.apk
