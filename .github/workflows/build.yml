name: FRIDAY PRO - FINAL ONE SHOT
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip git python3-pip autoconf libtool pkg-config libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Build APK
        run: |
          buildozer android debug || true
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          if [ -f "friday-pro1/buildozer.spec" ]; then cd friday-pro1; fi
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-PRO-APK
          path: |
            bin/*.apk
            friday-pro1/bin/*.apk
