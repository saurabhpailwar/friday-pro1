name: FRIDAY PRO - FINAL ONE SHOT

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Build APK One Shot
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir: friday-pro1
          buildozer_version: master
          command: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-PRO-APK
          path: friday-pro1/bin/*.apk
